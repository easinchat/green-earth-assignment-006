<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Earth</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Nav section -->
    <header class="">
      <nav>
        <div class="navbar bg-base-100 shadow-sm bg-[#15803D] px-10">
          <div class="navbar-start">
            <a class="btn btn-ghost text-xl text-white">Green Earth</a>
          </div>
          <div class="navbar-center lg:flex text-white">
            <ul class="menu menu-horizontal px-1">
              <li><a>About</a></li>
              <li>
                <summary>Gallery</summary>
              </li>
              <li><a>Plant a Tree</a></li>
            </ul>
          </div>
          <div class="navbar-end">
            <a
              class="btn border-none shadow-none text-[#15803D] rounded-3xl bg-[#FACC15]"
              >Plant a Tree</a
            >
          </div>
        </div>
      </nav>
    </header>

    <!-- ``````````````````````````banner section````````````````````````````````` -->

    <section class="bg-[#CFF0DC]">
      <div class="main-div flex justify-evenly pt-10 items-center">
        <div><img src="./assets/hero-leaf1.png" alt="" /></div>
        <div class="text-center space-y-5">
          <h2 class="font-bold text-5xl">Plant a Tree, Grow a Future</h2>
          <p>
            Join our mission to plant 1 million trees and make the Earth greener
            for future generations.
          </p>
          <button>
            <a
              class="btn border-none shadow-none text-[#15803D] rounded-3xl bg-[#FACC15]"
              >Plant a Tree</a
            >
          </button>
        </div>
        <div><img src="./assets/hero-leaf2.png" alt="" /></div>
      </div>
    </section>
  </body>
</html>
